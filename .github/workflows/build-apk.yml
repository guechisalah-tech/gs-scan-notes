name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffolding
        run: |
          cp -r lib /tmp/lib_backup
          flutter create --platforms=android --org com.gsscan --project-name gs_scan_notes .
          rm -rf lib && cp -r /tmp/lib_backup lib
          rm -f test/widget_test.dart
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_overrides/proguard-rules.pro android/app/proguard-rules.pro

      - name: Set minSdk to 24
        run: |
          f=android/app/build.gradle.kts
          [ -f "$f" ] || f=android/app/build.gradle
          sed -i -E 's/minSdk(Version)?[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/; s/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/' "$f"
          grep -n minSdk "$f"

      - name: Get packages
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: flutter test

      - name: Raise compileSdk of plugins to 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'GRADLE'
          allprojects { p ->
            p.afterEvaluate {
              def a = p.extensions.findByName('android')
              if (a != null) {
                def cur = a.hasProperty('compileSdk') ? a.compileSdk : null
                if (cur == null || cur < 36) {
                  if (a.hasProperty('compileSdk')) { a.compileSdk = 36 } else { a.compileSdkVersion(36) }
                }
              }
            }
          }
          GRADLE
          cat ~/.gradle/init.d/compilesdk.gradle

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: GS-Scan-Notes-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
